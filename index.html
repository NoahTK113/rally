<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banjoball</title>
<style>
  html,body{margin:0;height:100%;background:#070910;overflow:hidden;
    font-family:ui-monospace,Consolas,monospace;color:#c9d4e2}
  /* Nothing of the game is present until a mode is chosen — the menu is a
     screen in its own right, not a scrim over a game already in progress. */
  canvas{display:none;width:100vw;height:100vh}
  body.playing canvas{display:block}
  body.playing canvas{cursor:none}
  /* Diagnostics live behind H, together with the tuning panel: one key, one
     view. Controls and connection state stay up, since a player needs those. */
  #tag,#help,#status{display:none}
  body.playing #help,body.playing #status{display:block}
  body.playing.debug #tag{display:block}
  #tag{position:fixed;bottom:66px;left:16px;font-size:11px;line-height:1.65;color:#66788f;
       pointer-events:none;text-shadow:0 1px 3px #000}
  #help{position:fixed;bottom:14px;left:16px;font-size:10.5px;line-height:1.8;color:#4d5c72;
        pointer-events:none;text-shadow:0 1px 3px #000}
  #help b{color:#8fa3bd;font-weight:600}

  #panel{position:fixed;top:0;left:0;right:0;z-index:10;display:none;flex-wrap:wrap;
         align-items:flex-end;gap:9px 13px;padding:9px 14px 10px;font-size:10px;
         background:rgba(8,12,19,.92);border-bottom:1px solid #1a2534;backdrop-filter:blur(8px)}
  body.playing.debug #panel{display:flex}
  #panel .grp{align-self:center;font-size:9px;letter-spacing:.15em;text-transform:uppercase;
              color:#3f4d61;padding-left:11px;border-left:1px solid #1c2838}
  #panel .grp.first{padding-left:0;border-left:0}
  .knob{display:flex;flex-direction:column;gap:4px;width:100px}
  .knob .row{display:flex;justify-content:space-between;gap:5px;line-height:1;color:#67788d}
  .knob .v{color:#c9d4e2;font-variant-numeric:tabular-nums}
  .knob input{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
              background:#22303f;outline:none;margin:0;cursor:pointer}
  .knob input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
              border-radius:50%;background:#22d3ee;cursor:pointer}
  #panel button{background:#141c28;color:#c9d4e2;border:1px solid #24344a;border-radius:5px;
                padding:5px 10px;font:inherit;font-size:10px;cursor:pointer}
  #panel button:hover{border-color:#33496a}

  #menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(120% 100% at 50% 0%, #0d1420 0%, #05070c 70%)}
  #menu.hidden,#setup.hidden,#setupOwner.hidden{display:none}
  #setup{position:fixed;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;
         background:radial-gradient(120% 100% at 50% 0%, #0d1420 0%, #05070c 70%)}
  #setup .card{width:340px;padding:26px;border:1px solid #1d2939;border-radius:14px;
               background:rgba(12,17,26,.96);box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center}
  #setup h1{font-size:15px;letter-spacing:.3em;font-weight:600;color:#8fa3bd}
  .lab{font-size:9.5px;letter-spacing:.2em;color:#4d5c72;margin-bottom:10px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
  .stepper button{width:38px;height:38px;padding:0;font-size:18px;line-height:1;
                  background:#151d2b;color:#c9d4e2;border:1px solid #263449;border-radius:9px;
                  cursor:pointer}
  .stepper button:hover:not(:disabled){border-color:#22d3ee}
  .stepper button:disabled{opacity:.3;cursor:default}
  #ptVal{min-width:74px;font-size:30px;font-weight:700;color:#e6edf6;font-variant-numeric:tabular-nums}
  #ptRange{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
           background:#22303f;outline:none;margin:0 0 10px;cursor:pointer}
  #ptRange::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
           background:#22d3ee;cursor:pointer}
  #ptRange:disabled::-webkit-slider-thumb{background:#3f4d61;cursor:default}
  .hint{font-size:10px;color:#66788f;margin-bottom:22px}
  #setup .go{width:100%;padding:12px;font:inherit;font-size:11px;letter-spacing:.14em;
             border-radius:8px;cursor:pointer;background:#151d2b;color:#c9d4e2;
             border:1px solid #263449}
  #setup .go:hover:not(:disabled){border-color:#22d3ee;color:#e6edf6}
  #setup .go:disabled{opacity:.45;cursor:default}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg button{flex:1;padding:11px 0;font:inherit;font-size:13px;letter-spacing:.14em;
              border-radius:9px;cursor:pointer;background:#151d2b;color:#66788f;
              border:1px solid #263449}
  .seg button:hover:not(:disabled){color:#c9d4e2}
  .seg button.on{border-color:#22d3ee;color:#e6edf6;background:#16222f}

  .sens{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;
        border-top:1px solid #1c2838;font-size:13px;letter-spacing:.14em;color:#4d5c72}
  .sens input{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
              background:#22303f;outline:none;cursor:pointer}
  .sens input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
              border-radius:50%;background:#22d3ee;cursor:pointer}
  .sens .v{color:#c9d4e2;font-variant-numeric:tabular-nums;min-width:45px;text-align:right}

  #sensBar{position:fixed;bottom:14px;right:16px;z-index:9;display:none;align-items:center;
           gap:10px;font-size:13px;letter-spacing:.12em;color:#5b6c82;
           text-shadow:0 1px 3px #000}
  body.playing #sensBar{display:flex}
  #sensBar input{-webkit-appearance:none;appearance:none;width:120px;height:3px;
                 border-radius:2px;background:#22303f;outline:none;cursor:pointer}
  #sensBar input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
                 border-radius:50%;background:#22d3ee;cursor:pointer}
  #sensBar .v{color:#c9d4e2;font-variant-numeric:tabular-nums;min-width:41px}

  #lockHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;
            display:none;padding:22px 38px;border-radius:14px;font-size:30px;
            letter-spacing:.08em;color:#e6edf6;background:rgba(10,14,22,.93);
            border:1px solid #2b3d57;pointer-events:none;text-align:center}
  #lockHint small{display:block;margin-top:12px;font-size:15px;letter-spacing:.1em;
                  color:#66788f}

  #tut{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;
       display:none;min-width:420px;max-width:70vw;padding:18px 26px;text-align:center;
       border-radius:12px;background:rgba(10,14,22,.92);border:1px solid #24344a;
       pointer-events:none}
  body.tutorial #tut{display:block}
  #tutText{font-size:20px;line-height:1.45;color:#e6edf6;letter-spacing:.04em}
  #tutText b{color:#22d3ee;font-weight:600}
  #tutHint{margin-top:8px;font-size:13px;color:#66788f;letter-spacing:.08em}
  #tutDots{display:flex;gap:7px;justify-content:center;margin-top:14px}
  #tutDots i{width:7px;height:7px;border-radius:50%;background:#24344a;display:block}
  #tutDots i.on{background:#22d3ee}
  #tutDots i.past{background:#2f5c6b}
  body.playing:not(.locked) #lockHint{display:block}

  #setup .msg{margin-top:13px;font-size:10.5px;line-height:1.6;color:#66788f;min-height:16px}
  #menu .card{width:340px;padding:26px 26px 22px;border:1px solid #1d2939;border-radius:14px;
              background:rgba(12,17,26,.96);box-shadow:0 24px 70px rgba(0,0,0,.6);text-align:center}
  #menu h1,#setup h1{margin:0 0 20px;font-size:30px;letter-spacing:.32em;font-weight:700;color:#e6edf6}
  #menu button{width:100%;padding:11px;margin-bottom:9px;font:inherit;font-size:11px;
               letter-spacing:.13em;border-radius:8px;cursor:pointer;
               background:#151d2b;color:#c9d4e2;border:1px solid #263449}
  #menu button:hover:not(:disabled){border-color:#22d3ee;color:#e6edf6}
  #menu button:disabled{opacity:.4;cursor:default}
  #menu .join{display:flex;gap:7px}
  #menu input{flex:1;min-width:0;padding:11px;font:inherit;font-size:12px;letter-spacing:.28em;
              text-align:center;text-transform:uppercase;border-radius:8px;
              background:#0b1119;color:#e6edf6;border:1px solid #263449;outline:none}
  #menu input:focus{border-color:#22d3ee}
  #menu .join button{width:92px;margin:0}
  #menu .msg{margin-top:14px;font-size:10.5px;line-height:1.6;color:#66788f;min-height:30px}
  #menu .code{display:block;margin-top:6px;font-size:26px;letter-spacing:.42em;color:#22d3ee}

  /* Above the menu's z-index on purpose: you want to check the build BEFORE
     connecting, not after. */
  #build{position:fixed;top:10px;left:14px;z-index:30;font-size:10px;letter-spacing:.14em;
         color:#3f4d61;pointer-events:none;text-shadow:0 1px 3px #000}
  #status{position:fixed;top:10px;right:14px;z-index:9;font-size:10px;letter-spacing:.1em;
          color:#5b6c82;text-shadow:0 1px 3px #000;pointer-events:none;text-align:right}
  #status b{color:#c9d4e2;font-weight:600;letter-spacing:.24em}
</style>

<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="tag"></div>
<div id="help"></div>
<div id="build"></div>
<div id="status"></div>
<div id="sensBar">
  <span>MOUSE</span>
  <input id="sensPlay" type="range" min="0.2" max="3" step="0.05" value="1">
  <span class="v" id="sensPlayVal">1.00</span>
  <span>SOUND</span>
  <input id="volPlay" type="range" min="0" max="1" step="0.05" value="0.7">
  <span class="v" id="volPlayVal">70</span>
</div>
<div id="lockHint"><span id="lockMain">CLICK TO START</span><small id="lockSub">&nbsp;</small></div>
<div id="tut">
  <div id="tutText"></div>
  <div id="tutHint"></div>
  <div id="tutDots"></div>
</div>
<div id="setup" class="hidden">
  <div class="card">
    <div id="setupOwner">
      <h1>SETUP</h1>
      <div class="lab">PADDLES PER PLAYER</div>
      <div class="seg">
        <button id="pd1">1</button>
        <button id="pd2">2</button>
      </div>
      <div class="lab">POINTS TO WIN</div>
      <div class="stepper">
        <button id="ptMinus">&minus;</button>
        <div id="ptVal">7</div>
        <button id="ptPlus">+</button>
      </div>
      <input id="ptRange" type="range" min="0" max="100" step="1" value="7">
      <div class="hint" id="ptHint">first to 7 goals</div>
      <button class="go" id="btnStart">START MATCH</button>
    </div>
    <div class="sens">
      <span>MOUSE</span>
      <input id="sensSetup" type="range" min="0.2" max="3" step="0.05" value="1">
      <span class="v" id="sensSetupVal">1.00</span>
    </div>
    <div class="sens" style="margin-top:12px;padding-top:0;border-top:0">
      <span>SOUND</span>
      <input id="volSetup" type="range" min="0" max="1" step="0.05" value="0.7">
      <span class="v" id="volSetupVal">70</span>
    </div>
    <div class="msg" id="setupMsg"></div>
  </div>
</div>
<div id="menu">
  <div class="card">
    <h1>BANJOBALL</h1>
    <button id="btnTutorial">HOW TO PLAY</button>
    <button id="btnSolo">PRACTICE ALONE</button>
  </div>
</div>
<script>
/* ==========================================================================
   SESSION STATE REGISTRY

   Anything that outlives a match and must not. Twice now a new variable was
   added, the reset was written somewhere else, and a stale value from the
   previous game leaked into the next one — the ready flag started matches on
   their own, and an opponent began each game holding the previous one's state.

   The cure is to keep the clear NEXT TO the declaration. Registering is one
   line directly under the variable, so forgetting means noticing while you
   write it rather than while you play it. startGame runs the lot.

   Defined here, ahead of the other scripts, so they can register at load.
   ========================================================================== */
var SESSION_RESETS = [];
function onNewGame(fn) { SESSION_RESETS.push(fn); }
function resetSession() { for (var i = 0; i < SESSION_RESETS.length; i++) SESSION_RESETS[i](); }
</script>
<script src="ai.js?v=v15.7-local"></script>
<script src="audio.js?v=v15.7-local"></script>
<script src="tutorial.js?v=v15.7-local"></script>
<script>
'use strict';

// ---- arena, all in metres -------------------------------------------------
const A = {
  width: 20, height: 12,    // inner playing area
  netHeight: 2.95, netT: 0.10,
  goalLip: 3.00,            // gap between the floor and the bottom of the opening
  goalHeight: 3.00,         // size of the opening
  goalDepth: 0.70,          // how far the box extends outside the field
  cornerR: 0.11,            // rounding on the arena contour. WORLD units, not
                            // derived from the hairline, so collision geometry
                            // never changes when the window resizes.
  crossFrac: 0.35,         // how far the OFFENCE paddle may reach into the far
                            // half, as a fraction of that half's width
  defFrac: 0.65,            // share of a player's own half reserved for defence
  paddleLength: 0.85,
  paddleT: 0.05,
  margin: 0.9,
};

/* Paddle response. Springs are given as (frequency, damping ratio) rather than
   (k, c) because those are the numbers you can reason about: frequency is how
   hard it chases, damping below 1 overshoots. The paddle is never teleported to
   the cursor — it CHASES it, which is what gives it real linear and angular
   velocity for the ball impulse to read later. */
const FEEL = {
  posFreq   :  4.9,   // Hz
  posDamp   : 1.10,   // 1.0 = critically damped
  angFreq   : 11.0,   // Hz
  angDamp   : 1.60,
  maxError  : 0.75,   // metres. The proportional term is clamped to this, so
                      // the spring has the SAME authority everywhere — in open
                      // space a distant cursor no longer buys extra force that
                      // a wall-pinned target cannot match. Effectively this,
                      // not the cursor distance, is what sets top paddle speed;
                      // freq and damping just set how fast it gets there.
                      // Must stay <= reach, or boundaries go mushy again.
  reach     : 0.80,   // metres the TARGET may run past the legal box. World
                      // units on purpose: screen-space overshoot would give
                      // players with wider windows more force at the walls.
};

/* Wheel rotation is QUANTISED rather than accumulated. A wheel only emits
   coarse discrete notches, so free accumulation drifts off the angles that
   actually matter and you can never quite reach flat or upright.

   Both steps are exact divisors of 90 degrees, so 0 and 90 and every multiple
   are always on the grid. And the coarse step is a whole multiple of the fine
   one, so switching between them never strands the paddle between grids. */
const STEP_COARSE = 30.0 * Math.PI / 180;   // 90 / 3
const STEP_FINE   =  7.5 * Math.PI / 180;   // 90 / 12, and exactly a quarter of coarse

/* Which paddle THIS browser drives. The host takes blue (+1) and the joining
   player takes red (-1); solo play is blue. Everything else keys off the side
   value, so nothing else needs to know about roles. */
let mySide = +1;

// One stroke weight for the whole game. Strokes only ever delineate; anything
// that needs to look thick is real geometry instead. linePx is the width of the
// line you actually SEE, in device pixels — kept even so a stroke centred on an
// integer device coordinate covers whole pixels.
const VIS = { linePx: 2, glow: 1.9 };

// Markings (centre line, goal lines) are drawn on top of everything, so the
// whole stroke is visible and this is their width directly.
const lineW = () => VIS.linePx / view.sDev;

// The arena contour is stroked BEFORE the interior fill, which then covers its
// inward half — so it has to be stroked at twice the visible width to end up
// looking the same weight as a marking.
const contourW = () => (VIS.linePx * 2) / view.sDev;

// Match rules.
const MATCH = { target: 7, paddles: 2 };   // target 0 = endless

const PHYS = {
  gravity      : 5.20,   // m/s^2
  ballR        : 0.15,   // m
  restitution  : 0.66,   // bounciness against arena and net
  friction     : 0.35,   // tangential -> this is what generates spin
  paddleRest   : 0.18,   // paddles are livelier than walls
  paddleFriction: 0.60,  // and grippier, so slicing actually bites
  goalPull     : 28.0,   // outward pull inside a goal box, so a ball that
                         // trickles in is always drawn out through the back
  restThreshold: 0.60,   // below this closing speed a contact stops bouncing,
                         // otherwise the ball jitters forever on the floor
};

const COL = {
  border    : '#3b82f6',
  court     : '#090a0c',
  net       : '#fdba74',
  netCap    : '#fed7aa',
  center    : '#3b82f6',    // same blue as the border; alpha applied at draw time
  pocket       : '#05070b',
  blue         : '#22d3ee',   // ALWAYS the right side, for both players
  red          : '#fb7185',   // ALWAYS the left side
  ball         : '#f8fafc',
  ballSeam     : 'rgba(15,23,42,.55)',
  blueFill     : 'rgba(34,211,238,.10)',
  redFill      : 'rgba(251,113,133,.10)',
};

// A goal belongs to whoever defends it.
/* Sides are coloured absolutely — right is blue, left is red — for BOTH
   players. If each browser painted "me" blue the two would disagree about who
   just scored, which is the kind of confusion no amount of UI fixes. */
const goalColour = side => side > 0 ? COL.blue : COL.red;
const goalFill   = side => side > 0 ? COL.blueFill : COL.redFill;

const opts = { showTarget: false, showVectors: false };
let renderAlpha = 1;

// Outward glow: the same contour stroked a few times, widening and fading.
// Cheap, corner-safe (lineJoin handles it), and no shadowBlur cost.
const GLOW = [
  [40, 0.035], [30, 0.045], [22, 0.055], [16, 0.070],
  [11, 0.090], [7.5, 0.115], [5, 0.150], [3, 0.220],
];

const goalY0 = () => A.goalLip;
const goalY1 = () => A.goalLip + A.goalHeight;

// ---- world -> screen ------------------------------------------------------
const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function bounds() {
  const out = A.goalDepth + A.margin;
  return {
    minX: -out,       maxX: A.width  + out,
    minY: -A.margin,  maxY: A.height + A.margin,
  };
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = view.dpr = Math.min(devicePixelRatio || 1, 2);
  const cw = view.cw = innerWidth, ch = view.ch = innerHeight;
  const cwDev = Math.round(cw * dpr), chDev = Math.round(ch * dpr);
  canvas.width = cwDev;
  canvas.height = chDev;

  // Keep the arena clear of the tuning panel rather than letting it overlap.
  const panelEl = document.getElementById('panel');
  const panelDev = Math.round(panelEl.offsetHeight * dpr);
  const availDev = Math.max(1, chDev - panelDev);

  const b = bounds();
  const w = b.maxX - b.minX, h = b.maxY - b.minY;

  // Quantise to a whole number of DEVICE pixels per metre. The court is a
  // whole number of metres across, so this lands x=0, x=W, y=0 and y=H on the
  // same pixel world.phase and vertical walls rasterise identically to horizontal
  // ones. Without it the two axes sit at unrelated sub-pixel offsets and the
  // antialiaser spreads their ink differently, which reads as a colour shift.
  const sDev = view.sDev = Math.max(1, Math.floor(Math.min(cwDev / w, availDev / h)));
  view.scale = sDev / dpr;

  // Snap the world origin to a whole device pixel, for the same reason.
  view.oxDev = Math.round((cwDev - w * sDev) / 2 - b.minX * sDev);
  view.oyDev = Math.round(panelDev + (availDev - h * sDev) / 2 + b.maxY * sDev);
  view.ox = view.oxDev / dpr;
  view.oy = view.oyDev / dpr;

  render();
}

// Built from the snapped integers directly, so no float drift creeps back in.
const worldCtx  = () => ctx.setTransform(view.sDev, 0, 0, -view.sDev,
                                         view.oxDev, view.oyDev);
const screenCtx = () => ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
const toWorld = (px, py) => ({ x: (px - view.ox) / view.scale, y: (view.oy - py) / view.scale });

/* ==========================================================================
   ARENA CONTOUR
   The single source of truth for the arena boundary. These are the segments
   the ball will collide against; the renderer strokes the same list. There is
   no separate collider and no offset copy, so the two cannot drift apart.
   ========================================================================== */
function arenaPoints() {
  const W = A.width, H = A.height, d = A.goalDepth;
  const y0 = goalY0(), y1 = goalY1();
  return [
    { x: 0,     y: 0  },   // bottom-left
    { x: 0,     y: y0 },   // left lip, inner
    { x: -d,    y: y0 },   // left box, bottom-outer
    { x: -d,    y: y1 },   // left box, top-outer
    { x: 0,     y: y1 },   // left crossbar, inner
    { x: 0,     y: H  },   // top-left
    { x: W,     y: H  },   // top-right
    { x: W,     y: y1 },   // right crossbar, inner
    { x: W + d, y: y1 },   // right box, top-outer
    { x: W + d, y: y0 },   // right box, bottom-outer
    { x: W,     y: y0 },   // right lip, inner
    { x: W,     y: 0  },   // bottom-right
  ];
}

// Closed polygon with rounded corners. Radius is clamped so it can never
// exceed half the shortest edge (e.g. if goalLip is dialled down to zero).
function traceRounded(pts, r) {
  const n = pts.length;
  let shortest = Infinity;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    shortest = Math.min(shortest, Math.hypot(b.x - a.x, b.y - a.y));
  }
  r = Math.min(r, shortest * 0.45);

  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  ctx.beginPath();
  const start = mid(pts[n - 1], pts[0]);
  ctx.moveTo(start.x, start.y);
  for (let i = 0; i < n; i++) {
    const cur = pts[i], m = mid(cur, pts[(i + 1) % n]);
    if (r > 0) ctx.arcTo(cur.x, cur.y, m.x, m.y, r);
    else ctx.lineTo(cur.x, cur.y);
    ctx.lineTo(m.x, m.y);
  }
  ctx.closePath();
}

function traceArena() { traceRounded(arenaPoints(), A.cornerR); }

/* The same contour cut in two at mid-court, so each team's half can be drawn
   in its own colour. Split points land mid-edge, never on a corner, and the
   arcs are generated from the same vertices and radius as the closed path —
   so the two halves lie exactly on it and the interior fill still trims them. */
function halfPoints(side) {
  const W = A.width, H = A.height, d = A.goalDepth;
  const y0 = goalY0(), y1 = goalY1(), m = W / 2;
  return side < 0
    ? [{ x: m, y: 0 }, { x: 0, y: 0 }, { x: 0, y: y0 }, { x: -d, y: y0 },
       { x: -d, y: y1 }, { x: 0, y: y1 }, { x: 0, y: H }, { x: m, y: H }]
    : [{ x: m, y: H }, { x: W, y: H }, { x: W, y: y1 }, { x: W + d, y: y1 },
       { x: W + d, y: y0 }, { x: W, y: y0 }, { x: W, y: 0 }, { x: m, y: 0 }];
}

function traceHalf(side) {
  const pts = halfPoints(side), n = pts.length;
  let shortest = Infinity;
  for (let i = 0; i < n - 1; i++) {
    shortest = Math.min(shortest, Math.hypot(pts[i + 1].x - pts[i].x,
                                             pts[i + 1].y - pts[i].y));
  }
  const r = Math.min(A.cornerR, shortest * 0.45);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < n - 1; i++) {
    ctx.arcTo(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, r);
  }
  ctx.lineTo(pts[n - 1].x, pts[n - 1].y);
}

// Net is a BODY, not a boundary: the ball can hit either face or the cap, so
// it keeps real thickness and a matching capsule collider later.
function traceNet() {
  const nx = A.width / 2, r = A.netT / 2, top = A.netHeight - r;
  ctx.beginPath();
  ctx.moveTo(nx - r, 0);
  ctx.lineTo(nx - r, top);
  ctx.arc(nx, top, r, Math.PI, 0, true);
  ctx.lineTo(nx + r, 0);
  ctx.closePath();
}

/* ==========================================================================
   PADDLES
   ========================================================================== */
const DEG = Math.PI / 180;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* Two paddles a side, foosball style: one is under the mouse, the other holds
   position until you switch to it. Both are always solid, so the idle one can
   be parked as a wall, a rebound surface, or a pass target. */
const PIDS = ['L0', 'L1', 'R0', 'R1'];
const idOf = (side, i) => (side < 0 ? 'L' : 'R') + i;
const activeId = (w, side) => idOf(side, w.sel[String(side)] || 0);

/* index 0 is OFFENCE: it lives in the front of the player's half and is the
   only one that may reach across the net. index 1 is DEFENCE: it lives in the
   back and is the only one allowed inside the goal box. Each starts well
   inside its own zone. */
function makePaddle(side, index) {
  const mid = A.width / 2, wall = side < 0 ? 0 : A.width;
  const x = index === 0 ? mid + side * A.width * 0.14
                        : wall - side * A.width * 0.12;
  const y = A.height * 0.30;
  return {
    side, index,                 // side: -1 left, +1 right
    x, y, a: 0,                  // pose
    vx: 0, vy: 0, w: 0,          // linear velocity, angular velocity (rad/s)
    tx: x, ty: y, ta: 0,         // spring targets
    px: x, py: y, pa: 0,         // previous pose, for render interpolation
  };
}

/* INPUT is captured once per tick and stored, never read from inside the
   simulation. That is the whole point: re-running tick 400 must use tick 400's
   input, not whatever the mouse is doing now. It is what keeps the physics
   from ever reaching out and touching an input device. */
/* A VIRTUAL cursor in world units. Clamped to the same box the paddle target
   is clamped to, which does two things: it can never leave the field, and
   overshooting stops accumulating dead travel you would have to drag back. */
const cursor = { x: 0, y: 0 };

/* Uncaptured, the cursor IS the physical mouse, so anything we assign to it is
   overwritten by the next mouse event. These carry an origin offset, which
   turns absolute mapping into relative-from-a-reference and lets the cursor be
   moved — to the paddle you just picked up, say — and stay moved. */
const rawMouse = { x: 0, y: 0, seen: false };
const mouseOrigin = { x: 0, y: 0 };

// Put the cursor at a chosen point and make it stick, whichever mode we are in.
function placeCursor(x, y) {
  cursor.x = x; cursor.y = y;
  if (rawMouse.seen) { mouseOrigin.x = x - rawMouse.x; mouseOrigin.y = y - rawMouse.y; }
  else { mouseOrigin.x = 0; mouseOrigin.y = 0; }
}

/* Capture integrates raw mouse movement instead of mapping absolute position,
   which is what makes both the clamp and a sensitivity setting possible: an
   absolute mapping has no scale factor to adjust. Sensitivity is a LOCAL
   preference — it depends on the desk, not the match — so it is never sent. */
const USE_POINTER_LOCK = true;
const MOUSE = { sens: 1 };
let pointerLocked = false;

const intent = { sel: 0, tx: 0, ty: 0, ta: 0, rdy: 0 };  // what the player wants, live
const liveInput = { '-1': { sel: 0, tx: 0, ty: 0, ta: 0, rdy: 0 },
                    '1':  { sel: 0, tx: 0, ty: 0, ta: 0, rdy: 0 } };
onNewGame(() => {
  intent.sel = 0; intent.rdy = 0;
  for (const k of ['-1', '1']) liveInput[k].rdy = 0;
});

/* The paddle the player is holding RIGHT NOW, per their intent — not per the
   simulation, which only learns about a switch on the next tick. Anything on
   the input side has to use this or it spends a tick applying the previous
   paddle's rules: with zones that meant clamping the cursor into the zone it
   had just left, and the two would then chase each other. */
const heldPaddle = () => paddles[idOf(mySide, intent.sel)];

/* Until the mouse is captured, nothing responds. Driving the paddle from an
   uncaptured pointer is what leaves the real cursor and the in-game one in
   different places, and once a player loses track of which is which no amount
   of explaining fixes it. Freezing everything makes the requirement obvious
   rather than merely stated. */
const controlsLive = () => !USE_POINTER_LOCK || pointerLocked;

function clampCursor() {
  const boxes = paddleBoxes(heldPaddle());
  const t = nearestLegal(boxes, cursor.x, cursor.y);
  const r = FEEL.reach;
  cursor.x = cursor.x < t.x - r ? t.x - r : cursor.x > t.x + r ? t.x + r : cursor.x;
  cursor.y = cursor.y < t.y - r ? t.y - r : cursor.y > t.y + r ? t.y + r : cursor.y;
}

function captureInto(dst, dt) {
  /* Before the whistle the cursor is pinned to the paddle rather than merely
     ignored. Letting it wander while the count runs would mean the paddle
     lunges for wherever it ended up the instant control returns — the player
     would start the round already out of position, through no action of
     their own. */
  if (world.phase === PHASE.READY || world.phase === PHASE.COUNT) {
    const p = heldPaddle();
    placeCursor(p.x, p.y);
    intent.tx = p.x; intent.ty = p.y; intent.ta = p.a;
  } else if (controlsLive()) {
    clampCursor();
    intent.tx = cursor.x; intent.ty = cursor.y;
  }
  dst.sel = intent.sel; dst.rdy = intent.rdy;
  dst.tx = intent.tx; dst.ty = intent.ty; dst.ta = intent.ta;
}

const keys = new Set();
let mouse = { x: A.width / 2, y: A.height / 2 }, mouseInside = false;

// Semi-implicit Euler on a (frequency, damping) spring. Scalar on purpose:
// this runs 240x a second and object-literal vectors would just make garbage.
function spring(cur, vel, target, freq, damp, dt) {
  const w = 2 * Math.PI * freq;
  const nv = vel + (w * w * (target - cur) - 2 * damp * w * vel) * dt;
  return [cur + nv * dt, nv];
}

/* The boxes the paddle's CENTRE may occupy. Its own half plus a slice of the
   far one, and — because the goal line is only a scoring plane, not a wall —
   the inside of its own goal box too. Extents come from the rotated paddle, so
   the whole body stays inside whichever box it is in.

   Two boxes rather than one because the legal region is L-shaped. The clamp
   below snaps to whichever is NEAREST, which keeps the correction tiny: at
   240 Hz the paddle only ever moves a few centimetres per step, so it can
   never be far enough outside for the choice to jump it anywhere visible. */
function paddleBoxes(p) {
  const c = Math.abs(Math.cos(p.a)), s = Math.abs(Math.sin(p.a));
  const L = A.paddleLength / 2, T = A.paddleT / 2;
  const hx = L * c + T * s, hy = L * s + T * c;

  /* Zones. A player's half is split: the back share belongs to defence and the
     front to offence, and only offence may cross the net. Without this both
     paddles could be stacked in the goal mouth, or side by side on the net.
     Limits apply to the paddle BODY, so hx keeps the rotated box inside. */
  const mid = A.width / 2, cross = mid * A.crossFrac;
  const wall = p.side < 0 ? 0 : A.width;
  const split = wall - p.side * (A.width / 2) * A.defFrac;
  const reachAcross = mid - p.side * cross;

  // With a single paddle there are no zones to divide: it owns the whole half
  // plus the slice across the net, exactly as it did before the second one.
  const solo = MATCH.paddles === 1;
  const lo = solo ? reachAcross : (p.index === 0 ? reachAcross : split);
  const hi = solo ? wall        : (p.index === 0 ? split : wall);
  const fx0 = Math.min(lo, hi) + hx;
  const fx1 = Math.max(lo, hi) - hx;

  const boxes = [{ x0: fx0, x1: fx1, y0: hy, y1: A.height - hy }];

  // own goal pocket — defence only, and only if it fits through the mouth
  const gy0 = goalY0() + hy, gy1 = goalY1() - hy;
  if ((MATCH.paddles === 1 || p.index === 1) && gy1 >= gy0) {
    boxes.push(p.side > 0
      ? { x0: fx0, x1: A.width + A.goalDepth - hx, y0: gy0, y1: gy1 }
      : { x0: -A.goalDepth + hx, x1: fx1,          y0: gy0, y1: gy1 });
  }
  for (const b of boxes) {
    if (b.x0 > b.x1) b.x0 = b.x1 = (b.x0 + b.x1) / 2;
    if (b.y0 > b.y1) b.y0 = b.y1 = (b.y0 + b.y1) / 2;
  }
  return boxes;
}

// Nearest legal point across all boxes, plus which axes were corrected.
function nearestLegal(boxes, x, y) {
  let best = null, bestD = Infinity;
  for (const b of boxes) {
    const cx = clamp(x, b.x0, b.x1), cy = clamp(y, b.y0, b.y1);
    const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
    if (d < bestD) { bestD = d; best = { x: cx, y: cy }; }
  }
  return best;
}

/* Pure: the target comes from the input record, never from a global. A null
   input means this paddle is not the one being held, so it keeps the target it
   already has and the spring parks it there. */
function stepPaddle(p, inp, dt) {
  p.px = p.x; p.py = p.y; p.pa = p.a;
  if (inp) { p.tx = inp.tx; p.ty = inp.ty; p.ta = inp.ta; }
  /* The POSE is constrained, not the target. Clamping the target would make
     the spring error — and therefore the force — collapse to zero as the
     paddle neared a wall, so it would creep in instead of driving in. Here the
     target stays out ahead, the spring keeps full authority right up to the
     boundary, and the paddle is then stopped hard against it.
     The target is still bounded, but by a fixed distance in METRES, so window
     size can't buy anyone extra force at the walls. */
  const boxes = paddleBoxes(p);
  const reach = FEEL.reach;
  const t = nearestLegal(boxes, p.tx, p.ty);
  p.tx = p.tx < t.x - reach ? t.x - reach : p.tx > t.x + reach ? t.x + reach : p.tx;
  p.ty = p.ty < t.y - reach ? t.y - reach : p.ty > t.y + reach ? t.y + reach : p.ty;

  /* Position uses a clamped error, and clamps the error VECTOR rather than
     each axis, so top speed is the same in every direction instead of being
     sqrt(2) faster on the diagonals. */
  {
    const w = 2 * Math.PI * FEEL.posFreq, z = FEEL.posDamp;
    const maxE = Math.min(FEEL.maxError, FEEL.reach);
    let ex = p.tx - p.x, ey = p.ty - p.y;
    const e = Math.hypot(ex, ey);
    if (e > maxE) { const k = maxE / e; ex *= k; ey *= k; }
    p.vx += (w * w * ex - 2 * z * w * p.vx) * dt;
    p.vy += (w * w * ey - 2 * z * w * p.vy) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }

  // Hard stop at the boundary, per axis so the paddle still slides along a
  // wall it is pressed against. Velocity into the wall is killed, not
  // reflected — this is a kinematic limit, not a bounce.
  const legal = nearestLegal(boxes, p.x, p.y);
  if (legal.x !== p.x) { if ((legal.x - p.x) * p.vx < 0) p.vx = 0; p.x = legal.x; }
  if (legal.y !== p.y) { if ((legal.y - p.y) * p.vy < 0) p.vy = 0; p.y = legal.y; }
  [p.a, p.w ] = spring(p.a, p.w , p.ta, FEEL.angFreq, FEEL.angDamp, dt);

  /* NO ANGLE WRAPPING. It used to shift target and pose together by a turn to
     keep the numbers tidy, which is invisible locally — the spring only reads
     their difference — but catastrophic across a network: the moment one peer
     wraps, it sends a target 360 degrees away from the other peer's pose, and
     that peer's spring answers a ~358 degree error with a full-speed flick.
     Angles are unbounded instead. A double carries thousands of radians with
     more precision than we could ever need. */
}

// Velocity of a point rigidly attached to the paddle: v + omega x r.
// Exactly the quantity the ball impulse will need once collisions exist.
function tipVelocity(p, endSign) {
  const c = Math.cos(p.a), s = Math.sin(p.a);
  const rx = endSign * (A.paddleLength / 2) * c;
  const ry = endSign * (A.paddleLength / 2) * s;
  return { x: p.x + rx, y: p.y + ry, vx: p.vx - p.w * ry, vy: p.vy + p.w * rx };
}

/* ==========================================================================
   BALL
   Rigid disc: position, velocity, orientation and spin. Spin is carried from
   the start even though nothing reads it yet — retrofitting angular state into
   a collision solver later is far more painful than carrying it now.
   ========================================================================== */
function makeBall() {
  return {
    x: 0, y: 0, a: 0,        // pose (a = orientation, for the spin marker)
    vx: 0, vy: 0, w: 0,      // velocity, angular velocity (rad/s)
    px: 0, py: 0, pa: 0,     // previous pose, for render interpolation
  };
}

/* A goal is scored when the ball's CENTRE crosses a goal line, inside the
   mouth. The line is a scoring plane only — it never blocks anything.

   Scoring runs a small state machine rather than a single pause:
     play      normal
     exit      ball is ghosted: gravity only, no collisions, so it sails out
               through the back of the goal and off the board
     announce  "<TEAM> TEAM SCORED" for two seconds
     count     3 - 2 - 1, then the tip-off drops */
const PHASE = { PLAY: 'play', EXIT: 'exit', ANNOUNCE: 'announce',
                COUNT: 'count', WIN: 'win', HOLD: 'hold', READY: 'ready' };
const ANNOUNCE_T = 2.0;
const WIN_T      = 4.0;          // how long the result stands before the lobby
const COUNT_T    = 3.0;
const EXIT_MAX_T = 1.5;          // fallback if the ball never clears the back

/* ==========================================================================
   THE WORLD
   Every value the simulation reads or writes lives here, in one object that
   can be copied wholesale. That is what makes save, compare and restore
   possible — which is what any AI, replay or analysis will want. Tuning
   constants
   (A, FEEL, PHYS) stay outside: they are settings, not state.
   ========================================================================== */
function makeWorld() {
  return {
    tick: 0,
    p: { L0: makePaddle(-1, 0), L1: makePaddle(-1, 1),
         R0: makePaddle(1, 0),  R1: makePaddle(1, 1) },
    sel: { '-1': 0, '1': 0 },    // which paddle each side is holding
    ball: makeBall(),
    scores: { '-1': 0, '1': 0 },
    phase: PHASE.PLAY,
    phaseT: 0,
    lastScorer: 0,
    ballHidden: false,

    /* Contacts worth hearing, recorded by the simulation rather than played
       from it, so nothing in the physics ever has to know that sound exists.
       Ids let the audio layer play each contact exactly once. */
    evCount: 0,
    ev: Array.from({ length: EV_SLOTS },
                   () => ({ id: 0, kind: '', mag: 0, x: 0, side: 0 })),
  };
}

function pushEvent(w, kind, mag, x, side) {
  // Contacts during the goal exit are real but invisible — the ball is clipped
  // once it passes the back of the net while still being pulled out at speed.
  const contact = kind === 'paddle' || kind === 'wall' || kind === 'net';
  if (contact && w.phase !== PHASE.PLAY) return;

  w.evCount++;
  const e = w.ev[w.evCount % EV_SLOTS];
  e.id = w.evCount; e.kind = kind; e.mag = mag; e.x = x;
  e.side = side || 0;
}

const EV_SLOTS = 16;
const EV_MIN = 0.6;      // ignore resting contacts: m/s of impulse

const PADDLE_F = ['x', 'y', 'a', 'vx', 'vy', 'w', 'tx', 'ty', 'ta', 'px', 'py', 'pa'];
const BALL_F   = ['x', 'y', 'a', 'vx', 'vy', 'w', 'px', 'py', 'pa'];

// Copies INTO an existing world rather than returning a new one, so the
// aliases below stay valid forever and a copy allocates nothing.
function copyWorld(dst, src) {
  dst.tick = src.tick;
  for (const id of PIDS) {
    for (const f of PADDLE_F) dst.p[id][f] = src.p[id][f];
  }
  for (const k of ['-1', '1']) {
    dst.scores[k] = src.scores[k];
    dst.sel[k] = src.sel[k];
  }
  for (const f of BALL_F) dst.ball[f] = src.ball[f];
  dst.phase = src.phase;
  dst.phaseT = src.phaseT;
  dst.lastScorer = src.lastScorer;
  dst.ballHidden = src.ballHidden;
  dst.evCount = src.evCount;
  for (let i = 0; i < EV_SLOTS; i++) {
    const a = dst.ev[i], b = src.ev[i];
    a.id = b.id; a.kind = b.kind; a.mag = b.mag; a.x = b.x; a.side = b.side;
  }
}

const world = makeWorld();

// Stable references into the live world. Safe because copyWorld never
// replaces these objects, it only overwrites their fields.
const paddles = world.p;
const ball = world.ball;
const scores = world.scores;

const me   = () => paddles[activeId(world, mySide)];
const them = () => paddles[activeId(world, -mySide)];

const teamName = side => side > 0 ? 'BLUE' : 'RED';

// Read from MATCH rather than the world: it is a rule, not state. Both peers
// hold the same value because it is synced with the rest of the config.
function matchOver(w) {
  return MATCH.target > 0 &&
         (w.scores['-1'] >= MATCH.target || w.scores['1'] >= MATCH.target);
}

function checkGoal(w) {
  const b = w.ball;
  if (b.y < goalY0() || b.y > goalY1()) return;
  if (b.x <= 0)            award(w, +1);     // left goal conceded
  else if (b.x >= A.width) award(w, -1);
}

function award(w, side) {
  pushEvent(w, 'goal', 10, w.ball.x, side);   // side scored; each client
                                              // decides what that means
  w.scores[side]++;
  w.lastScorer = side;
  w.phase = PHASE.EXIT;
  w.phaseT = EXIT_MAX_T;
}

function resetRound(w, clearScore) {
  if (clearScore) { w.scores['-1'] = w.scores['1'] = 0; w.lastScorer = 0; }
  w.phase = PHASE.PLAY;
  w.phaseT = 0;
  w.ballHidden = false;
  serve(w);
}

// Tip-off: dropped dead centre from the ceiling with no velocity.
/* Back to the tip-off pose. Pose, spring target and render history all move
   together, and each for its own reason: leaving the target behind would have
   the spring haul the paddle straight back out again, and leaving the previous
   pose behind would draw one frame of it streaking across the court.

   Positions come from makePaddle rather than a stored copy, so they still
   follow the arena if its dimensions are retuned mid-session. */
function resetPaddles(w) {
  for (const side of [-1, 1]) {
    for (let i = 0; i < 2; i++) {
      const p = w.p[idOf(side, i)], home = makePaddle(side, i);
      p.x = p.tx = p.px = home.x;
      p.y = p.ty = p.py = home.y;
      p.a = p.ta = p.pa = 0;
      p.vx = p.vy = p.w = 0;
    }
  }
}

function serve(w) {
  const b = w.ball;
  b.x = A.width / 2;
  b.y = A.height - PHYS.ballR;
  b.vx = 0; b.vy = 0;
  b.a = 0;  b.w = 0;
  b.px = b.x; b.py = b.y; b.pa = 0;
}

/* One contact against an immovable surface. `n` points OUT of the surface,
   toward the ball; `pen` is how far the ball has sunk in.
   Treated as a disc, so I = 1/2 m R^2, which makes the tangential impulse
   needed to kill sliding exactly -vt/3. Friction is clamped to the Coulomb
   cone, and whatever tangential impulse survives becomes spin. */
function resolveContact(b, nx, ny, pen, rest, mu, svx = 0, svy = 0, maxPush = Infinity) {
  /* A paddle has infinite mass, so it wins every contact — including one where
     the ball is already against a wall. Left uncapped, its positional push
     drives the ball's CENTRE past the wall line, and from there the wall's own
     test computes an outward normal and expels it. Capping the push means a
     squeezed ball merely overlaps the paddle instead of escaping. */
  const push = pen > maxPush ? maxPush : pen;
  b.x += nx * push;
  b.y += ny * push;

  const R = PHYS.ballR;
  // velocity of the contact point: v + omega x r, with r = -R * n,
  // measured RELATIVE to the surface, which may itself be moving.
  const cvx = b.vx + b.w * ny * R - svx;
  const cvy = b.vy - b.w * nx * R - svy;

  const vn = cvx * nx + cvy * ny;
  if (vn >= 0) return;                       // already separating

  const tx = -ny, ty = nx;
  const vt = cvx * tx + cvy * ty;

  const e  = Math.abs(vn) < PHYS.restThreshold ? 0 : rest;
  const jn = -(1 + e) * vn;

  let jt = -vt / 3;
  const maxF = mu * jn;
  if (jt >  maxF) jt =  maxF;
  if (jt < -maxF) jt = -maxF;

  b.vx += jn * nx + jt * tx;
  b.vy += jn * ny + jt * ty;
  b.w  += -2 * jt / R;
  return jn;                 // how hard, for whoever wants to make a noise
}

/* ---------------------------------------------------------------------------
   Arena collision features, derived from the SAME points and the SAME radius
   the renderer rounds with, so the ball hits exactly what is drawn.

   A rounded contour is not just "segments plus a radius". At a reflex vertex
   (the goal-mouth tips — material poking into play) the arc is a convex
   obstacle, so it becomes a circle collider of radius r and the two adjacent
   segments must be TRIMMED back to their tangent points, or the sharp vertex
   would still be the nearest feature and the rounding would do nothing.

   Convex vertices (the field's own corners) are left sharp on purpose: there
   the rounding cuts INTO the corner, forming a pocket the ball cannot enter
   anyway whenever its radius is at least the corner radius — which it is by
   default. Below that the ball can nose a few mm deeper than drawn.

   Cached, because this runs up to eight times per tick and allocating it each
   time would be pure garbage.
--------------------------------------------------------------------------- */
let _feat = null;
const _featKey = [];

function arenaFeatures() {
  const sig = [A.width, A.height, A.goalLip, A.goalHeight, A.goalDepth, A.cornerR];
  if (_feat && sig.every((v, i) => v === _featKey[i])) return _feat;
  sig.forEach((v, i) => _featKey[i] = v);

  const pts = arenaPoints(), n = pts.length;
  let shortest = Infinity;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    shortest = Math.min(shortest, Math.hypot(b.x - a.x, b.y - a.y));
  }
  const r = Math.min(A.cornerR, shortest * 0.45);   // same clamp as the renderer

  const trim = new Array(n).fill(0);
  const arcs = [];
  if (r > 1e-6) {
    for (let i = 0; i < n; i++) {
      const prev = pts[(i - 1 + n) % n], cur = pts[i], next = pts[(i + 1) % n];
      // the outline is wound clockwise in this y-up space, so cross > 0 is reflex
      const inx = cur.x - prev.x, iny = cur.y - prev.y;
      const outx = next.x - cur.x, outy = next.y - cur.y;
      if (inx * outy - iny * outx <= 0) continue;

      let ax = -inx, ay = -iny; const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
      let bx = outx, by = outy; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
      const dot = Math.max(-1, Math.min(1, ax * bx + ay * by));
      const sinH = Math.sqrt(Math.max(1e-9, (1 - dot) / 2));
      const cosH = Math.sqrt(Math.max(0, (1 + dot) / 2));

      let mx = ax + bx, my = ay + by; const ml = Math.hypot(mx, my) || 1; mx /= ml; my /= ml;
      arcs.push({ x: cur.x + mx * r / sinH, y: cur.y + my * r / sinH, r });
      trim[i] = r * cosH / sinH;              // r / tan(half-angle)
    }
  }

  const backL = -A.goalDepth, backR = A.width + A.goalDepth;
  const atBack = x => Math.abs(x - backL) < 1e-9 || Math.abs(x - backR) < 1e-9;
  const CHUTE = 0.8;      // how far past the back plane the guides run

  const segs = [];
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
    const t0 = trim[i], t1 = trim[(i + 1) % n];
    if (len - t0 - t1 <= 1e-6) continue;      // wholly swallowed by its arcs

    // The back of each goal box has NO collider — the ball passes straight
    // through it and is hidden by the clip in drawBall.
    if (atBack(a.x) && atBack(b.x)) continue;

    const seg = { ax: a.x + ux * t0, ay: a.y + uy * t0,
                  bx: b.x - ux * t1, by: b.y - uy * t1 };

    // The pocket's top and bottom stay solid, and run on past the back plane
    // so the ball leaves down a clean chute instead of catching on an endpoint
    // it can no longer see. Invisible: it is all beyond the clip.
    if (Math.abs(seg.ay - seg.by) < 1e-9) {
      if (atBack(a.x)) seg.ax += (a.x < 0 ? -CHUTE : CHUTE);
      if (atBack(b.x)) seg.bx += (b.x < 0 ? -CHUTE : CHUTE);
    }
    segs.push(seg);
  }
  return (_feat = { segs, arcs, pts });
}

/* Ray cast against the arena outline. Cheap at twelve vertices, and it is the
   only way to be certain — any test built from individual contacts can be
   fooled by a ball that is already on the wrong side of everything. */
function insideArena(x, y) {
  const pts = arenaFeatures().pts;
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], c = pts[j];
    if ((a.y > y) !== (c.y > y) &&
        x < (c.x - a.x) * (y - a.y) / (c.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

/* Last line of defence. If the ball has ended up outside anyway, put it back
   on the nearest boundary and strip the velocity that took it there. This
   should never fire; when it does, the alternative is a lost ball and a game
   that cannot continue. */
function containBall(b) {
  if (insideArena(b.x, b.y)) return;

  const { segs } = arenaFeatures();
  let qx = 0, qy = 0, best = Infinity;
  for (const g of segs) {
    const ex = g.bx - g.ax, ey = g.by - g.ay;
    const len2 = ex * ex + ey * ey;
    let t = len2 > 0 ? ((b.x - g.ax) * ex + (b.y - g.ay) * ey) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = g.ax + ex * t, cy = g.ay + ey * t;
    const d2 = (b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy);
    if (d2 < best) { best = d2; qx = cx; qy = cy; }
  }
  const dx = qx - b.x, dy = qy - b.y;
  const d = Math.hypot(dx, dy) || 1;
  const ux = dx / d, uy = dy / d;          // points back toward the inside
  b.x = qx + ux * PHYS.ballR;
  b.y = qy + uy * PHYS.ballR;
  const vn = b.vx * ux + b.vy * uy;
  if (vn < 0) { b.vx -= vn * ux; b.vy -= vn * uy; }   // drop the outward part
}

function collideArena(w) {
  const b = w.ball;
  const { segs, arcs } = arenaFeatures();
  const R = PHYS.ballR;

  for (const g of segs) {
    const ex = g.bx - g.ax, ey = g.by - g.ay;
    const len2 = ex * ex + ey * ey;
    let t = len2 > 0 ? ((b.x - g.ax) * ex + (b.y - g.ay) * ey) / len2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    let dx = b.x - (g.ax + ex * t), dy = b.y - (g.ay + ey * t);
    let d = Math.hypot(dx, dy);
    if (d >= R) continue;
    if (d < 1e-9) { dx = 0; dy = 1; d = 1e-9; }
    const j = resolveContact(b, dx / d, dy / d, R - d, PHYS.restitution, PHYS.friction);
    if (j > EV_MIN) pushEvent(w, 'wall', j, b.x);
  }

  for (const c of arcs) {
    let dx = b.x - c.x, dy = b.y - c.y;
    let d = Math.hypot(dx, dy);
    const sum = R + c.r;
    if (d >= sum) continue;
    if (d < 1e-9) { dx = 1; dy = 0; d = 1e-9; }
    const j = resolveContact(b, dx / d, dy / d, sum - d, PHYS.restitution, PHYS.friction);
    if (j > EV_MIN) pushEvent(w, 'wall', j, b.x);
  }
}

// The net is a body, so it gets a capsule: a segment with a rounded cap.
function collideNet(w) {
  const b = w.ball;
  const rNet = A.netT / 2;
  const cx = A.width / 2;
  const cy = clamp(b.y, 0, Math.max(0, A.netHeight - rNet));
  let dx = b.x - cx, dy = b.y - cy;
  let d = Math.hypot(dx, dy);
  const R = PHYS.ballR + rNet;
  if (d >= R) return;
  if (d < 1e-9) { dx = 1; dy = 0; d = 1e-9; }
  const j = resolveContact(b, dx / d, dy / d, R - d, PHYS.restitution, PHYS.friction);
  if (j > EV_MIN) pushEvent(w, 'net', j, b.x);
}

/* Ball vs paddle. The paddle is drawn as a rounded rectangle with radius
   thickness/2, which makes it exactly a capsule — so the test is the same
   shape as the drawing, and the same shape as the net.

   This is where the spring-driven paddle finally pays off: the contact point
   carries v + omega x r, so swinging into the ball adds energy, dragging
   across it adds spin, and pulling away from it takes pace off. None of that
   is possible if the paddle is teleported to the cursor. */
function collidePaddle(w, p) {
  const b = w.ball;
  const R = PHYS.ballR;
  const half = Math.max(0, (A.paddleLength - A.paddleT) / 2);   // spine length
  const rad  = A.paddleT / 2;

  const c = Math.cos(p.a), s = Math.sin(p.a);
  const dx = b.x - p.x, dy = b.y - p.y;
  const lx =  dx * c + dy * s;          // ball in the paddle's local frame
  const ly = -dx * s + dy * c;

  const qx = clamp(lx, -half, half);    // closest point on the spine
  let nx = lx - qx, ny = ly;
  let d = Math.hypot(nx, ny);
  const sum = R + rad;
  if (d >= sum) return;
  if (d < 1e-9) { nx = 0; ny = 1; d = 1e-9; }
  nx /= d; ny /= d;

  const wnx = nx * c - ny * s;          // normal back into world space
  const wny = nx * s + ny * c;

  // material point of the paddle at the contact, relative to its centre
  const rx = qx * c + rad * wnx;
  const ry = qx * s + rad * wny;
  const svx = p.vx - p.w * ry;
  const svy = p.vy + p.w * rx;

  const j = resolveContact(b, wnx, wny, sum - d, PHYS.paddleRest, PHYS.paddleFriction,
                           svx, svy, PHYS.ballR * 0.5);
  if (j > EV_MIN) pushEvent(w, 'paddle', j, b.x);
}

// skipPaddles asks "where would this go if nobody touched it"
function stepBall(w, dt, collide = true, skipPaddles = false) {
  const b = w.ball;
  b.px = b.x; b.py = b.y; b.pa = b.a;

  // A fast ball against a fast-swinging paddle can close more than the contact
  // depth in one tick. Substep the ball only — the paddles hold the pose they
  // were stepped to, which is close enough at this rate and much simpler than
  // interpolating them.
  const speed = Math.hypot(b.vx, b.vy);
  const sub = Math.min(8, 1 + Math.floor(speed * dt / (PHYS.ballR * 0.5)));
  const h = dt / sub;

  // Inside a goal box the ball is pulled outward, so one that dribbles in
  // still leaves through the back rather than sitting in the net.
  const inGoal = (b.x < 0 || b.x > A.width) &&
                 b.y >= goalY0() && b.y <= goalY1();
  const pull = inGoal ? (b.x < 0 ? -PHYS.goalPull : PHYS.goalPull) : 0;

  for (let i = 0; i < sub; i++) {
    b.vx += pull * h;
    b.vy -= PHYS.gravity * h;
    b.x  += b.vx * h;
    b.y  += b.vy * h;
    b.a  += b.w * h;
    if (collide) {
      if (!skipPaddles) {
        for (let i = 0; i < PIDS.length; i++) {
          const pd = w.p[PIDS[i]];
          if (MATCH.paddles === 1 && pd.index === 1) continue;
          collidePaddle(w, pd);
        }
      }
      collideNet(w);
      collideArena(w);      // last, so the ball can never be left inside a wall
      // Only while the ball is meant to be on the court: during a goal it is
      // supposed to leave through the back of the net.
      if (w.phase === PHASE.PLAY) containBall(b);
    }
  }
}

// ---- layers ---------------------------------------------------------------
const LAYERS = [
  { name: 'background', space: 'screen', cacheable: true,  draw: drawBackground },
  { name: 'field',      space: 'world',  cacheable: true,  draw: drawField      },
  { name: 'actors',     space: 'world',  cacheable: false, draw: drawActors     },
  { name: 'effects',    space: 'world',  cacheable: false, draw: drawEffects     },
  { name: 'hud',        space: 'screen', cacheable: false, draw: drawHud        },
];

function render() {
  for (const layer of LAYERS) {
    (layer.space === 'screen' ? screenCtx : worldCtx)();
    layer.draw();
  }
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, view.ch);
  bg.addColorStop(0, '#0a0e17'); bg.addColorStop(1, '#05070c');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, view.cw, view.ch);
}

/* Draw order does the alignment work: the glow and the hairline are laid down
   first on the exact boundary, then the interior fills are painted over the
   top. The fills trim the inward half of every stroke, so the visible edge is
   exactly x = 0 — an outside-aligned stroke with no offset maths anywhere. */
function drawField() {
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  // 1 + 2. each half of the boundary in its own team colour, glow then line
  for (const side of [-1, 1]) {
    traceHalf(side);
    ctx.strokeStyle = goalColour(side);
    for (const [px, alpha] of GLOW) {
      ctx.lineWidth = px / view.scale;
      ctx.globalAlpha = alpha * VIS.glow;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = contourW();
    ctx.stroke();
  }

  // 3. interior, filled with the SAME path. It has to be the contour and not
  //    a rectangle: a rounded corner cuts diagonally across the corner, so an
  //    axis-aligned fill would paint straight over the arc and erase it.
  traceArena();
  ctx.fillStyle = COL.court;
  ctx.fill();

  // 4. pocket shading, clipped to the contour for the same reason
  ctx.save();
  traceArena();
  ctx.clip();
  fillPocket(-1);
  fillPocket(+1);
  ctx.restore();

  drawGoalLine(-1);
  drawGoalLine(+1);
  drawReachLines();
  drawNet();
}

function fillPocket(side) {
  const d = A.goalDepth, y0 = goalY0();
  const x0 = side < 0 ? -d : A.width;
  ctx.fillStyle = COL.pocket;
  ctx.fillRect(x0, y0, d, A.goalHeight);
  ctx.fillStyle = goalFill(side);
  ctx.fillRect(x0, y0, d, A.goalHeight);
}

// The plane the ball must cross to score. A marking, not part of the silhouette.
function drawGoalLine(side) {
  const x = side < 0 ? 0 : A.width;
  ctx.strokeStyle = goalColour(side);
  ctx.globalAlpha = 0.30;
  ctx.lineWidth = lineW();
  ctx.beginPath();
  ctx.moveTo(x, goalY0());
  ctx.lineTo(x, goalY1());
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* One dashed line per paddle, marking how far that paddle may reach. A
   paddle's line sits in the OPPONENT's half and carries that paddle's colour —
   so the blue line is the furthest blue may come, drawn on red's ground. */
function drawReachLines() {
  const mid = A.width / 2, cross = mid * A.crossFrac;
  ctx.lineWidth = lineW();
  ctx.setLineDash([0.14, 0.16]);
  for (const side of [-1, 1]) {
    ctx.strokeStyle = goalColour(side);

    // how far this side's offence may reach
    ctx.globalAlpha = 0.28;
    ctx.beginPath();
    ctx.moveTo(mid - side * cross, 0);
    ctx.lineTo(mid - side * cross, A.height);
    ctx.stroke();

    // and where its own half hands over from offence to defence
    if (MATCH.paddles === 1) continue;
    const wall = side < 0 ? 0 : A.width;
    const split = wall - side * (A.width / 2) * A.defFrac;
    ctx.globalAlpha = 0.13;
    ctx.beginPath();
    ctx.moveTo(split, 0);
    ctx.lineTo(split, A.height);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawNet() {
  traceNet();
  ctx.strokeStyle = COL.net;
  for (const [px, alpha] of GLOW) {
    ctx.lineWidth = px * 0.5 / view.scale;
    ctx.globalAlpha = alpha * 0.8 * VIS.glow;
    ctx.stroke();
  }
  // Hollow, like the arena: fill with the court colour purely to knock the
  // inward half of the glow back out, then lay the outline on top.
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.court;
  ctx.fill();
  ctx.lineWidth = lineW();
  ctx.strokeStyle = COL.net;
  ctx.stroke();
}

function pathRR(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);     ctx.arcTo(x + w, y,     x + w,     y + r,     r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h,     r);
  ctx.lineTo(x + r, y + h);     ctx.arcTo(x,     y + h, x,         y + h - r, r);
  ctx.lineTo(x, y + r);         ctx.arcTo(x,     y,     x + r,     y,         r);
  ctx.closePath();
}

function drawPaddle(x, y, a, colour, ghost) {
  const L = A.paddleLength, T = A.paddleT;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  pathRR(-L / 2, -T / 2, L, T, T / 2);
  if (ghost) {
    ctx.strokeStyle = colour;
    ctx.globalAlpha = 0.20;
    ctx.lineWidth = lineW();
    ctx.setLineDash([0.10, 0.09]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = colour;
    for (const [px, alpha] of GLOW) {
      ctx.lineWidth = px * 0.5 / view.scale;
      ctx.globalAlpha = alpha * VIS.glow;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = colour;
    ctx.fill();
  }
  ctx.restore();
}

function drawBall() {
  if (world.ballHidden) return;
  // Clipped to the arena silhouette, so crossing the open back of a goal box
  // cuts the ball off against the line — it slides behind it and is gone.
  ctx.save();
  traceArena();
  ctx.clip();
  const x = lerp(ball.px, ball.x, renderAlpha);
  const y = lerp(ball.py, ball.y, renderAlpha);
  const a = lerp(ball.pa, ball.a, renderAlpha);
  const R = PHYS.ballR;

  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.strokeStyle = COL.ball;
  for (const [px, alpha] of GLOW) {
    ctx.lineWidth = px * 0.4 / view.scale;
    ctx.globalAlpha = alpha * VIS.glow;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = COL.ball;
  ctx.fill();

  /* Seams, tennis-ball style: two arcs of a larger circle offset either side,
     clipped to the ball. They read as curved surface lines rather than a flat
     marker, and because they are asymmetric the spin direction is legible. */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.clip();

  ctx.strokeStyle = COL.ballSeam;
  ctx.lineWidth = Math.max(lineW(), R * 0.13);
  ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(side * R * 1.5, 0, R * 1.25, 0, Math.PI * 2);
    ctx.stroke();
  }
  // a short equator dash so pure spin is still readable head-on
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.42, -0.6, 0.6);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.restore();   // arena clip
}

function drawActors() {
  const mine = me();
  if (opts.showTarget) drawPaddle(mine.tx, mine.ty, mine.ta, goalColour(mine.side), true);

  // Idle paddles are drawn dimmer: still solid, but clearly not the one under
  // your hand. Without that the board reads as four equal objects.
  for (const id of PIDS) {
    const p = paddles[id];
    if (MATCH.paddles === 1 && p.index === 1) continue;
    const held = world.sel[String(p.side)] === p.index;
    ctx.globalAlpha = held ? 1 : 0.42;
    drawPaddle(lerp(p.px, p.x, renderAlpha),
               lerp(p.py, p.y, renderAlpha),
               lerp(p.pa, p.a, renderAlpha), goalColour(p.side), false);
    ctx.globalAlpha = 1;
  }
  drawBall();
}

function arrow(ox, oy, vx, vy, colour) {
  const len = Math.hypot(vx, vy);
  if (len < 1e-3) return;
  const ux = vx / len, uy = vy / len;
  const head = Math.min(0.16, len * 0.34);
  ctx.strokeStyle = colour;
  ctx.fillStyle = colour;
  ctx.lineWidth = lineW();
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  ctx.lineTo(ox + vx - ux * head, oy + vy - uy * head);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ox + vx, oy + vy);
  ctx.lineTo(ox + vx - ux * head - uy * head * 0.45, oy + vy - uy * head + ux * head * 0.45);
  ctx.lineTo(ox + vx - ux * head + uy * head * 0.45, oy + vy - uy * head - ux * head * 0.45);
  ctx.closePath();
  ctx.fill();
}

const VEL_SCALE = 0.11;   // metres of arrow per m/s

/* Our own cursor, because a thin OS arrow over a dark field is easy to lose.
   The tether to the paddle makes the spring visible: the longer it is, the
   harder the paddle is being pulled. */
function drawCursor() {
  if (!running) return;
  const p = heldPaddle();      // tether follows intent, so it never lags a switch
  const col = goalColour(mySide);
  const R = 0.13;

  ctx.strokeStyle = col;
  ctx.lineWidth = lineW();

  ctx.globalAlpha = 0.5;
  ctx.lineWidth = lineW() * 2.2;
  ctx.beginPath();
  ctx.moveTo(cursor.x, cursor.y);
  ctx.lineTo(lerp(p.px, p.x, renderAlpha), lerp(p.py, p.y, renderAlpha));
  ctx.stroke();

  ctx.lineWidth = lineW();
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.arc(cursor.x, cursor.y, R, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cursor.x - R * 1.9, cursor.y); ctx.lineTo(cursor.x - R * 0.55, cursor.y);
  ctx.moveTo(cursor.x + R * 0.55, cursor.y); ctx.lineTo(cursor.x + R * 1.9, cursor.y);
  ctx.moveTo(cursor.x, cursor.y - R * 1.9); ctx.lineTo(cursor.x, cursor.y - R * 0.55);
  ctx.moveTo(cursor.x, cursor.y + R * 0.55); ctx.lineTo(cursor.x, cursor.y + R * 1.9);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawEffects() {
  drawCursor();
  if (!opts.showVectors) return;
  const p0 = me();
  arrow(p0.x, p0.y, p0.vx * VEL_SCALE, p0.vy * VEL_SCALE, 'rgba(125,211,252,.9)');
  for (const end of [-1, 1]) {
    const t = tipVelocity(p0, end);
    arrow(t.x, t.y, t.vx * VEL_SCALE, t.vy * VEL_SCALE, 'rgba(232,121,249,.85)');
  }
}
// Canvas-space overlays land here; the corner readout is DOM for now.
function drawHud() {
  readout();

  // Positioned from the world transform so it always sits over the court,
  // but drawn in screen space — the world pass has a flipped y axis and would
  // render text upside down.
  const sx = view.ox + (A.width / 2) * view.scale;
  const sy = view.oy - (A.height - 0.62) * view.scale;
  const size = Math.max(13, Math.round(view.scale * 0.46));
  const gap  = size * 0.62;

  ctx.font = `600 ${size}px ui-monospace, Consolas, monospace`;
  ctx.textBaseline = 'middle';
  const flash = world.phase !== PHASE.PLAY;
  ctx.globalAlpha = flash ? 1 : 0.75;

  ctx.textAlign = 'right';
  ctx.fillStyle = world.lastScorer === -1 && flash ? '#ffffff' : goalColour(-1);
  ctx.fillText(String(scores['-1']), sx - gap, sy);

  ctx.textAlign = 'left';
  ctx.fillStyle = world.lastScorer === 1 && flash ? '#ffffff' : goalColour(1);
  ctx.fillText(String(scores['1']), sx + gap, sy);

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(140,160,185,.35)';
  ctx.fillText('–', sx, sy);
  ctx.globalAlpha = 1;

  if (MATCH.target > 0) {
    ctx.font = `600 ${Math.max(9, Math.round(size * 0.28))}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = 'rgba(140,160,185,.4)';
    ctx.fillText(MATCH.target + ' POINTS TO WIN', sx, sy + size * 0.72);
  }

  drawAnnouncement();
  paintLockHint();
}

/* The banner says what the click will actually do: before the match it starts
   it, mid-match it only takes the mouse back. The third case — ready, and
   waiting on somebody else — cannot happen any more. */
function paintLockHint() {
  if (!running) return;
  let main, sub;
  if (world.phase === PHASE.READY) {
    main = 'CLICK TO START';
    sub  = '';
  } else {
    main = 'CLICK TO CAPTURE THE MOUSE';
    sub  = 'controls are disabled until you do';
  }
  if ($('lockMain').textContent !== main) $('lockMain').textContent = main;
  if ($('lockSub').textContent !== sub) {
    $('lockSub').textContent = sub;
    $('lockSub').style.display = sub ? '' : 'none';   // no empty gap below
  }
}

function drawAnnouncement() {
  if (world.phase !== PHASE.ANNOUNCE && world.phase !== PHASE.COUNT &&
      world.phase !== PHASE.WIN) return;

  const cx = view.ox + (A.width / 2) * view.scale;
  const cy = view.oy - (A.height * 0.52) * view.scale;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (world.phase === PHASE.WIN) {
    const side = world.lastScorer;
    const size = Math.max(20, Math.round(view.scale * 0.72));
    ctx.font = `700 ${size}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = goalColour(side);
    ctx.globalAlpha = Math.min(1, (WIN_T - world.phaseT) / 0.25);
    ctx.fillText(`${teamName(side)} TEAM WON`, cx, cy);
    ctx.globalAlpha = 1;
    return;
  }

  if (world.phase === PHASE.ANNOUNCE) {
    const size = Math.max(16, Math.round(view.scale * 0.55));
    ctx.font = `700 ${size}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = goalColour(world.lastScorer);
    // brief fade-in so it does not just snap on
    ctx.globalAlpha = Math.min(1, (ANNOUNCE_T - world.phaseT) / 0.18);
    ctx.fillText(`${teamName(world.lastScorer)} TEAM SCORED`, cx, cy);
  } else {
    const n = Math.max(1, Math.ceil(world.phaseT));
    const frac = world.phaseT - Math.floor(world.phaseT);      // 1 -> 0 within each second
    const size = Math.max(22, Math.round(view.scale * 1.25));
    ctx.font = `700 ${size}px ui-monospace, Consolas, monospace`;
    ctx.fillStyle = '#c9d4e2';
    ctx.globalAlpha = 0.25 + 0.6 * frac;           // each digit fades as it ages
    ctx.fillText(String(n), cx, cy);
  }
  ctx.globalAlpha = 1;
}

// Steady-state speed at full clamped error: w^2 * e = 2*z*w*v.
function maxPaddleSpeed() {
  const w = 2 * Math.PI * FEEL.posFreq;
  return w * Math.min(FEEL.maxError, FEEL.reach) / (2 * FEEL.posDamp);
}

/* The HUD carries fast-moving values; repainting it every frame makes them
   unreadable. Built a few times a second and held in between. */
let readoutAcc = 0;
let readoutHold = '';

function readout() {
  document.getElementById('tag').innerHTML = readoutHold;
}

function buildReadout() {
  const p = me();
  const tip = tipVelocity(p, 1);
  const f = (n, d = 2) => n.toFixed(d).padStart(6);
  const out =
    `${fps.toFixed(0).padStart(3)} fps   ${String(stepsLastFrame).padStart(2)} steps/frame` +
    (frozen ? '   <b style="color:#fdba74">FROZEN</b>' : '') + '<br>' +
    `pos   ${f(p.x)}, ${f(p.y)} m<br>` +
    `angle ${f(p.a / DEG, 1)}&deg;  (target ${(p.ta / DEG).toFixed(1)})<br>` +
    `vel   ${f(Math.hypot(p.vx, p.vy))} m/s   max ${f(maxPaddleSpeed())}<br>` +
    `omega ${f(p.w / DEG, 1)} &deg;/s<br>` +
    `tip   ${f(Math.hypot(tip.vx, tip.vy))} m/s<br>` +
    `ball  ${f(Math.hypot(ball.vx, ball.vy))} m/s   spin ${f(ball.w / DEG, 0)} °/s<br>` +
    `tick  ${world.tick}`;
  return out;
}

// ---- input ----------------------------------------------------------------
/* Locked, we integrate raw movement at exactly the scale the absolute mapping
   used, so the feel is unchanged — only the escape route is removed. */
canvas.addEventListener('mousemove', e => {
  if (!controlsLive()) {
    // keep tracking the pointer so the offset maths stays valid if capture is
    // ever switched off again
    const r0 = canvas.getBoundingClientRect();
    const w0 = toWorld(e.clientX - r0.left, e.clientY - r0.top);
    rawMouse.x = w0.x; rawMouse.y = w0.y; rawMouse.seen = true;
    return;
  }
  if (pointerLocked) {
    const k = MOUSE.sens / view.scale;
    const dx = (e.movementX || 0) * k, dy = -(e.movementY || 0) * k;
    cursor.x += dx;
    cursor.y += dy;
    tutOnMove(dx, dy);
  } else {
    const r = canvas.getBoundingClientRect();
    const w = toWorld(e.clientX - r.left, e.clientY - r.top);
    rawMouse.x = w.x; rawMouse.y = w.y; rawMouse.seen = true;
    cursor.x = w.x + mouseOrigin.x;
    cursor.y = w.y + mouseOrigin.y;
  }
  mouseInside = true;
});

canvas.addEventListener('mousedown', e => {
  audioStart();
  if (USE_POINTER_LOCK && e.button === 0 && running && !pointerLocked &&
      canvas.requestPointerLock) {
    canvas.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  document.body.classList.toggle('locked', pointerLocked);
  // Take hold starting from the paddle, so control can never begin adrift.
  if (pointerLocked && running) {
    const np = heldPaddle();
    placeCursor(np.x, np.y);
    intent.rdy = 1;          // the click that captures the mouse is the ready
  }
});
document.addEventListener('pointerlockerror', () => { pointerLocked = false; });
let fineRotate = false;   // right mouse button held

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => { if (e.button === 2) fineRotate = true; });
addEventListener('mouseup',        e => { if (e.button === 2) fineRotate = false; });
addEventListener('blur',           () => { fineRotate = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!controlsLive()) return;
  // Snap to the active grid first, then advance exactly one notch, so the
  // target is always a clean multiple however it was last nudged.
  const step = fineRotate ? STEP_FINE : STEP_COARSE;
  const dir  = -Math.sign(e.deltaY);
  const was = intent.ta;
  intent.ta = (Math.round(intent.ta / step) + dir) * step;
  tutOnTurn(intent.ta - was, fineRotate);
}, { passive: false });

addEventListener('keydown', e => {
  if (!running) return;          // menu keys are the menu's business
  const k = e.key.toLowerCase();
  if (k === ' ' || k === '.' || k === 'tab') e.preventDefault();
  if (e.repeat) return;
  keys.add(k);
  if (k === 'p') frozen = !frozen;      // space now switches paddles
  if (k === '.') { stepOnce = true; frozen = true; }
  /* Take over the other team. The simulation has no notion of a player
     changing seats: whichever side mySide names is the one the mouse writes a
     setpoint for. */
  if (!controlsLive() && (k === ' ' || k === 'tab')) return;

  /* Take the other team's paddles. It used to have to retag the transport end
     that drove this seat; with one world there is nothing to tell but us. */
  if (k === 'tab') {
    mySide = -mySide;
    intent.sel = (world.sel[String(mySide)] | 0) & 1;
    const np = heldPaddle();
    placeCursor(np.x, np.y);
    intent.tx = np.x; intent.ty = np.y; intent.ta = np.a;
  }

  if (k === ' ' && MATCH.paddles > 1) {
    /* Take hold of the other paddle. The cursor moves to it rather than the
       paddle flying to the cursor — you pick up the handle where it is, which
       is what makes parking one somewhere useful rather than a liability. */
    intent.sel = intent.sel ? 0 : 1;
    const np = heldPaddle();
    // Adopt where it actually IS, not where it was heading: a paddle caught
    // mid-flight would otherwise carry on to a target you never chose.
    placeCursor(np.x, np.y);
    intent.tx = np.x; intent.ty = np.y; intent.ta = np.a;
    tutOnSwitch();
  }
  if (k === '[') setSens(MOUSE.sens - 0.05);   // capture blocks the slider,
  if (k === ']') setSens(MOUSE.sens + 0.05);   // so keys work mid-match too
  if (k === 'escape') { leaveGame(); return; }
  if (k === 'f') resetRound(world, false);
  if (k === 'r') resetRound(world, true);
  if (k === 'v') opts.showVectors = !opts.showVectors;
  if (k === 'g') opts.showTarget = !opts.showTarget;
  if (k === 'h') { document.body.classList.toggle('debug'); resize(); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('resize', resize);

const DEFAULTS = KNOBS.filter(k => !Array.isArray(k)).map(k => [k, k.o[k.k]]);

function buildPanel() {
  const el = document.getElementById('panel');
  el.innerHTML = '';
  let firstGroup = true;

  for (const k of KNOBS) {
    if (Array.isArray(k)) {
      const g = document.createElement('div');
      g.className = 'grp' + (firstGroup ? ' first' : '');
      g.textContent = k[0];
      el.appendChild(g);
      firstGroup = false;
      continue;
    }
    const wrap = document.createElement('label');
    wrap.className = 'knob';
    wrap.innerHTML =
      `<div class="row"><span>${k.label}</span><span class="v"></span></div>` +
      `<input type="range" min="${k.min}" max="${k.max}" step="${k.step}">`;
    const input = wrap.querySelector('input');
    const val   = wrap.querySelector('.v');
    const show  = () => { val.textContent = `${+k.o[k.k].toFixed(3)}${k.u}`; };
    input.value = k.o[k.k];
    show();
    input.addEventListener('input', () => {
      k.o[k.k] = parseFloat(input.value);
      show();
      if (k.refit) resize();
    });
    k._sync = () => { input.value = k.o[k.k]; show(); };
    el.appendChild(wrap);
  }

  const reset = document.createElement('button');
  reset.textContent = 'reset';
  reset.addEventListener('click', () => {
    for (const [k, v] of DEFAULTS) { k.o[k.k] = v; k._sync(); }
    resize();
  });
  el.appendChild(reset);
}
