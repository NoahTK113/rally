/* ---- loop -----------------------------------------------------------------
   Physics runs at a fixed rate, decoupled from the display, and the renderer
   interpolates between the last two poses. Variable-dt physics would make
   spring behaviour depend on frame rate and bounces non-deterministic later. */
const FIXED_DT = 1 / 240;
const MAX_STEPS = 12;          // don't spiral after a tab stall

let accumulator = 0;
let last = performance.now() / 1000;
let stepsLastFrame = 0;
let statusAcc = 0;
let frozen = false, stepOnce = false;
onNewGame(() => { frozen = false; stepOnce = false; });
let fps = 60, fpsAcc = 0, fpsN = 0;

/* One tick. Reads nothing but the world and the setpoints handed to it, so
   running it twice on the same arguments gives the same answer. */
function stepWorld(w, inp, dt) {
  w.tick++;
  for (const side of [-1, 1]) {
    const k = String(side);
    /* Nobody steers until the count reaches zero. A null input is exactly
       what an unheld paddle already gets, so the springs still run and the
       paddle holds its place — it is unmanned, not suspended. */
    const noCtl = w.phase === PHASE.READY || w.phase === PHASE.COUNT;
    const sel = noCtl ? (w.sel[k] | 0)
                      : (MATCH.paddles === 1 ? 0 : ((inp[k].sel | 0) & 1));
    w.sel[k] = sel;
    stepPaddle(w.p[idOf(side, 0)], !noCtl && sel === 0 ? inp[k] : null, dt);
    if (MATCH.paddles > 1) stepPaddle(w.p[idOf(side, 1)], !noCtl && sel === 1 ? inp[k] : null, dt);
  }

  if (w.phase === PHASE.PLAY) {
    stepBall(w, dt, true);
    checkGoal(w);

  } else if (w.phase === PHASE.EXIT) {
    stepBall(w, dt, true);            // still solid; the back is simply open
    w.phaseT -= dt;
    const out = A.goalDepth + PHYS.ballR * 2;
    const b = w.ball;
    if (b.x < -out || b.x > A.width + out || b.y < -out || w.phaseT <= 0) {
      w.ballHidden = true;
      w.phase = PHASE.ANNOUNCE;
      w.phaseT = ANNOUNCE_T;
    }

  } else if (w.phase === PHASE.ANNOUNCE) {
    w.phaseT -= dt;
    if (w.phaseT <= 0) {
      // The goal that ends a match still gets its announcement; only what
      // follows differs.
      if (matchOver(w)) { w.phase = PHASE.WIN; w.phaseT = WIN_T; }
      else { w.phase = PHASE.COUNT; w.phaseT = COUNT_T;
             resetPaddles(w);                            // everyone back on their mark
             pushEvent(w, 'count', 5, A.width / 2); }    // the first number
    }

  } else if (w.phase === PHASE.WIN) {
    if (w.phaseT > 0) w.phaseT -= dt;      // then it simply waits to be noticed

  } else if (w.phase === PHASE.COUNT) {
    // One beep per number as it appears, then a higher one on zero.
    const before = Math.ceil(w.phaseT);
    w.phaseT -= dt;
    if (w.phaseT > 0 && Math.ceil(w.phaseT) < before) {
      pushEvent(w, 'count', 5, A.width / 2);
    }
    if (w.phaseT <= 0) {
      pushEvent(w, 'go', 6, A.width / 2);
      resetRound(w, false);
    }
  }
}

/* The loop does not exist until a mode is chosen, so the menu is never
   sitting on top of a game that is already running. */
let running = false;

/* One local tick: write the setpoints, advance the world. That is the whole
   loop now.

   The published build runs this twice over — once as an authoritative server
   and once as a predicted client — and reconciles the two across a
   deliberately delayed link, so neither player has a shorter path to the truth
   than the other. That machinery is what fairness between two machines costs,
   and it buys nothing when the only player is at this keyboard. */
function stepLocal(dt) {
  captureInto(liveInput[String(mySide)], dt);

  /* Observe before stepping, so an observation is the world at the START of
     the tick the AI would have been acting on. It runs whether or not an
     opponent is switched on: perception costs almost nothing, and a ring that
     only fills while the AI plays would start every match blind. */
  aiStep(world, -mySide, liveInput[String(-mySide)], dt);

  /* The ready gate. It used to ask the server which seats still had to click
     in; with one player the question answers itself. */
  if (world.phase === PHASE.READY && intent.rdy) {
    world.phase = PHASE.COUNT;
    world.phaseT = COUNT_T;
    pushEvent(world, 'count', 5, A.width / 2);
  }

  stepWorld(world, liveInput, dt);
}

function startGame(asTutorial) {
  if (running) return;
  running = true;
  document.body.classList.add('playing');
  hideMenu();
  hideSetup();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  resize();

  const fresh = makeWorld();
  copyWorld(world, fresh);
  world.ballHidden = true;
  if (asTutorial) { world.phase = PHASE.HOLD;  world.phaseT = 0; }
  else            { world.phase = PHASE.READY; world.phaseT = 0; }

  /* The audio marker is a high-water mark over world.evCount, and a new game
     restarts that counter at zero — so without this every event in every match
     after the first has an id below the mark and is silently dropped. */
  lastEventSeen = 0;

  resetSession();          // every registered clear, in one call

  const mine = paddles[idOf(mySide, 0)];
  placeCursor(mine.x, mine.y);
  intent.tx = mine.x; intent.ty = mine.y; intent.ta = mine.a;
  for (const side of [-1, 1]) {
    const k = String(side), p = paddles[idOf(side, 0)];
    liveInput[k].sel = 0;
    liveInput[k].tx = p.x; liveInput[k].ty = p.y; liveInput[k].ta = p.a;
  }

  if (asTutorial) tutStart(); else tutStop();

  last = performance.now() / 1000;   // no giant first dt
  accumulator = 0;
  requestAnimationFrame(frame);
}

/* A finished match returns to the lobby rather than the main menu: the
   connection is still up and the settings are still wanted. Both peers reach
   this from the phase they are already being told about, so it needs no
   message of its own. */
function releaseMouse() {
  if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock();
  pointerLocked = false;
  document.body.classList.remove('locked');
}

function endMatch() {
  releaseMouse();
  running = false;
  document.body.classList.remove('playing');
  showSetup();
}

function stopGame() {
  releaseMouse();
  tutStop();
  running = false;
  document.body.classList.remove('playing');
  showMenu();
}

// Tear everything down and go back to the menu. Destroying the peer also
// releases the room code so it can be handed out again.
function leaveGame() {
  mySide = 1;
  stopGame();
}

function frame(nowMs) {
  if (!running) return;
  const now = nowMs / 1000;
  const dt = Math.min(now - last, 0.25);
  last = now;


  // The status chip carries live measurements now, so it has to be rewritten
  // rather than being painted once on connect.
  statusAcc += dt;
  if (statusAcc > 0.25) { statusAcc = 0; updateStatus(); }

  readoutAcc += dt;
  if (readoutAcc > 0.18) { readoutAcc = 0; readoutHold = buildReadout(); }

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.25) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }

  let steps = 0;
  if (!frozen) {
    accumulator += dt;
    while (accumulator >= FIXED_DT && steps < MAX_STEPS) {
      stepLocal(FIXED_DT);
      accumulator -= FIXED_DT; steps++;
    }
    if (steps >= MAX_STEPS) accumulator = 0;
  } else if (stepOnce) {
    stepLocal(FIXED_DT);
    steps = 1; stepOnce = false; accumulator = 0;
  }
  stepsLastFrame = steps;

  pumpEvents();
  pumpTutorial(dt);

  renderAlpha = frozen ? 1 : accumulator / FIXED_DT;
  render();

  if (world.phase === PHASE.WIN && world.phaseT <= 0) { endMatch(); return; }
  requestAnimationFrame(frame);
}

/* ==========================================================================
   NETWORKING — host-authoritative, with both sides simulating.

   The naive approach is to ship poses and apply them. That looks terrible:
   at 30 packets a second the remote paddle sits still for 33 ms and then
   teleports, while the screen refreshes four times as often.

   So instead BOTH machines run the identical simulation every tick, and the
   wire only carries what a simulation cannot guess — the other player's
   TARGET. The paddle is then genuinely animating on both screens rather than
   being repositioned. Snapshots still arrive, but they are used to correct
   drift rather than to drive motion, and the correction is applied as a
   fraction per packet so it is invisible unless something has gone badly
   wrong, in which case it snaps.

   The host stays authoritative: its ball is the real one, and its score and
   world.phase are simply obeyed.

   PeerJS's public broker only introduces the two browsers. Once connected the
   traffic is direct and the broker is out of the loop.
   ========================================================================== */
// Bump on every deploy. Shown top-left on the menu and in game so both
// players can confirm they are on the same build before blaming the netcode.
const BUILD = 'v15.7-local';


/* One pass over the simulation's event log per frame, feeding everything that
   cares. Audio and the tutorial both want to know about contacts and goals,
   and neither should depend on the other being alive — hanging the tutorial's
   observation inside the audio pump meant a browser that refused an
   AudioContext could never finish the "hit the ball" step. */
let lastEventSeen = 0;
/* A high-water mark over world.evCount, which restarts at zero every match —
   so without this every event in every later match is silently dropped. */
onNewGame(() => { lastEventSeen = 0; });

function pumpEvents() {
  const w = world;

  /* Never rewind. Reconciliation can move evCount BACKWARD: we predict a goal
     and bump the counter, then a snapshot arrives describing a tick before it.
     Replay regenerates the same ids, and rewinding here would fire every one
     of them a second time. Holding the high-water mark means a re-created
     event is ignored instead. */
  if (w.evCount <= lastEventSeen) return;

  const first = Math.max(lastEventSeen + 1, w.evCount - EV_SLOTS + 1);
  for (let id = first; id <= w.evCount; id++) {
    const e = w.ev[id % EV_SLOTS];
    if (!e || e.id !== id) continue;
    playEvent(e);            // no-ops if audio never started
    tutOnEvent(e.kind);
  }
  lastEventSeen = w.evCount;
}


const $ = id => document.getElementById(id);
function hideMenu() { $('menu').classList.add('hidden'); }
function showMenu() { $('menu').classList.remove('hidden'); hideSetup(); }
function hideSetup() { $('setup').classList.add('hidden'); }

/* The lobby. Reached once there is someone to play against — or straight away
   in practice — and returned to after a match. The host owns the settings and
   the guest waits, which avoids having to resolve two people editing the same
   number. */
function showSetup() {
  hideMenu();
  $('setup').classList.remove('hidden');
  $('setupMsg').innerHTML = '';
  paintTarget();
  paintPaddles();
}

function paintSens() {
  const v = MOUSE.sens.toFixed(2);
  $('sensSetup').value = MOUSE.sens;
  $('sensPlay').value = MOUSE.sens;
  $('sensSetupVal').textContent = v;
  $('sensPlayVal').textContent = v;
}

function paintVolume() {
  const pct = Math.round(AUDIO.vol * 100);
  $('volSetup').value = AUDIO.vol;
  $('volPlay').value = AUDIO.vol;
  $('volSetupVal').textContent = pct;
  $('volPlayVal').textContent = pct;
}

function setSens(v) {
  MOUSE.sens = Math.max(0.2, Math.min(3, Math.round(v * 100) / 100));
  try { localStorage.setItem('banjoball.sens', MOUSE.sens); } catch (e) {}
  paintSens();
}

function paintPaddles() {
  $('pd1').classList.toggle('on', MATCH.paddles === 1);
  $('pd2').classList.toggle('on', MATCH.paddles === 2);
}

function setPaddles(n) {
  MATCH.paddles = n === 1 ? 1 : 2;
  try { localStorage.setItem('banjoball.paddles', MATCH.paddles); } catch (e) {}
  paintPaddles();
}

function paintTarget() {
  const t = MATCH.target;
  $('ptVal').textContent = t === 0 ? '∞' : t;
  $('ptRange').value = t;
  $('ptHint').textContent = t === 0 ? 'endless — play until someone quits'
                                    : 'first to ' + t + (t === 1 ? ' goal' : ' goals');
}

function setTarget(v) {
  MATCH.target = Math.max(0, Math.min(100, Math.round(v) || 0));
  try { localStorage.setItem('banjoball.target', MATCH.target); } catch (e) {}
  paintTarget();
}

function beginMatch() {
  hideSetup();
  startGame();
}

/* Nothing left to report but which team you are on: no role, no room code, no
   ping, no injected link delay. */
function updateStatus() {
  $('status').innerHTML = teamName(mySide);
}

$('btnSolo').addEventListener('click', function () {
  mySide = 1; showSetup();
});
$('btnTutorial').addEventListener('click', function () {
  // Straight in: a lobby would be one more thing to explain before explaining
  // anything.
  mySide = 1;
  hideMenu();
  startGame(true);
});
$('btnStart').addEventListener('click', beginMatch);
$('pd1').addEventListener('click', () => setPaddles(1));
$('pd2').addEventListener('click', () => setPaddles(2));
$('ptMinus').addEventListener('click', () => setTarget(MATCH.target - 1));
$('ptPlus').addEventListener('click', () => setTarget(MATCH.target + 1));
$('ptRange').addEventListener('input', e => setTarget(parseInt(e.target.value, 10)));
$('sensSetup').addEventListener('input', e => setSens(parseFloat(e.target.value)));
$('sensPlay').addEventListener('input', e => setSens(parseFloat(e.target.value)));
$('volSetup').addEventListener('input', e => setVolume(parseFloat(e.target.value)));
$('volPlay').addEventListener('input', e => setVolume(parseFloat(e.target.value)));

/* Stored preferences carry the format version they were written under. Bump
   PREFS_VERSION when a stored value's MEANING changes — a rescaled
   sensitivity, a third paddle mode, a points target that stops meaning goals —
   and the whole set is dropped rather than read as something it never was.

   Note what is NOT here: none of the tuning lives in storage, so changing the
   physics or arena defaults never needs a bump. Only these five choices about
   the player persist, and wiping them is a real cost to that player — so bump
   it when a value would be MISREAD, not merely when a default moves. */
const PREFS_VERSION = 1;
const PREFS_KEYS = ['banjoball.target', 'banjoball.sens',
                    'banjoball.paddles', 'banjoball.vol'];

function prefsCheck() {
  try {
    const v = localStorage.getItem('banjoball.prefsVersion');
    // No stamp means prefs written before versioning existed. They are in the
    // current format, so they are adopted rather than thrown away.
    if (v === null || parseInt(v, 10) === PREFS_VERSION) {
      localStorage.setItem('banjoball.prefsVersion', PREFS_VERSION);
      return;
    }
    for (const k of PREFS_KEYS) localStorage.removeItem(k);
    localStorage.setItem('banjoball.prefsVersion', PREFS_VERSION);
  } catch (e) {}
}
prefsCheck();

try {
  const saved = parseInt(localStorage.getItem('banjoball.target'), 10);
  if (!isNaN(saved)) MATCH.target = Math.max(0, Math.min(100, saved));
  const ms = parseFloat(localStorage.getItem('banjoball.sens'));
  if (!isNaN(ms)) MOUSE.sens = Math.max(0.2, Math.min(3, ms));
  const pc = parseInt(localStorage.getItem('banjoball.paddles'), 10);
  if (pc === 1 || pc === 2) MATCH.paddles = pc;
  const vv = parseFloat(localStorage.getItem('banjoball.vol'));
  if (!isNaN(vv)) AUDIO.vol = Math.max(0, Math.min(1, vv));
} catch (e) {}
paintVolume();
paintTarget();
paintPaddles();
paintSens();
updateStatus();

buildPanel();
serve(world);
resize();
</script>
</body>
</html>
